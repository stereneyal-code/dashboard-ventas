<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Ejecutivo Comercial</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif;padding:20px}.card{background:#1e293b;border-radius:12px;padding:15px;margin:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.kpi{font-size:28px;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}canvas{background:#1e293b;border-radius:12px;padding:10px}@media(max-width:900px){.row{grid-template-columns:1fr}}</style></head><body><h1>Dashboard Ejecutivo Comercial</h1><div class="grid"><div class="card"><div>Venta Total</div><div class="kpi">₡304.5M</div></div><div class="card"><div>Meta Total</div><div class="kpi">₡297.4M</div></div><div class="card"><div>Cumplimiento</div><div class="kpi">102.4%</div></div><div class="card"><div>Tickets</div><div class="kpi">13,194</div></div></div><div class="row"><canvas id="c1"></canvas><canvas id="c2"></canvas></div><script>new Chart(document.getElementById('c1'),{type:'bar',data:{labels:['Alajuela','Escazú','Curridabat','Pavas'],datasets:[{label:'Meta',data:[33.6,27.7,24.6,43.5]},{label:'Venta',data:[36.7,27.8,23.6,37.3]}]}});new Chart(document.getElementById('c2'),{type:'bar',data:{labels:['Santa Ana','Call Center','Heredia 2','Alajuela'],datasets:[{label:'Cumplimiento %',data:[129.6,127.9,110.9,108.9]}]}});</script></body></html>
